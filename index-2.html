<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة ليك</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#102b52 0,#070d19 55%,#03060c 100%);font-family:Tahoma,Arial,sans-serif;color:#f3f7ff}
.card{width:min(100%,440px);padding:34px 24px;border:1px solid #234b7b;border-radius:25px;background:linear-gradient(145deg,rgba(11,27,49,.96),rgba(5,11,22,.98));box-shadow:0 22px 70px #0009;text-align:center}
.lock{width:70px;height:70px;margin:0 auto 20px;border:1px solid #315d91;border-radius:22px;display:grid;place-items:center;background:#0b1d35;color:#8fc2ff}
h1{font-size:30px;margin:0 0 10px;letter-spacing:.2px}
.desc{font-size:16px;color:#c0d2e9;margin:0 0 28px}
.label{font-size:13px;color:#91a9c8;margin-bottom:14px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:25px}
.unit{padding:13px 4px;border:1px solid #1e3b60;border-radius:13px;background:#09182c}
.num{display:block;font-size:27px;font-weight:700;color:#a6d0ff;font-variant-numeric:tabular-nums}
.unit small{display:block;margin-top:5px;color:#a8bdd8;font-size:12px}
.note{font-size:13px;line-height:1.9;color:#a9bdd8;margin:0}
.hidden{display:none}
.message{margin-top:22px;padding:20px;border:1px solid #315d91;border-radius:14px;background:#09182c;line-height:1.9;white-space:pre-wrap}
@media(max-width:360px){.num{font-size:22px}.card{padding:28px 16px}}
</style>
</head>
<body>
<main class="card">
  <div class="lock" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
  </div>
  <h1>رسالة ليك</h1>
  <p class="desc">رسالة ليكي يا هاجر</p>
  <p class="label" id="timerLabel">الوقت المتبقي لفتح الرسالة</p>
  <div class="timer" id="timer" aria-live="polite">
    <div class="unit"><span class="num" id="days">--</span><small>يوم</small></div>
    <div class="unit"><span class="num" id="hours">--</span><small>ساعة</small></div>
    <div class="unit"><span class="num" id="minutes">--</span><small>دقيقة</small></div>
    <div class="unit"><span class="num" id="seconds">--</span><small>ثانية</small></div>
  </div>
  <p class="note" id="note">الرسالة مش هتفتح غير في الوقت المحدد ليها</p>
  <section class="message hidden" id="message"></section>
</main>
<script>
/* غيّر النص بين علامتي التنصيص لاحقًا لإضافة رسالتك. */
const MESSAGE_TEXT = "هنا هتضيف رسالتك لهاجر بنفسك.";
const OPEN_AT = new Date("2027-03-05T15:00:00+02:00").getTime();
const $ = id => document.getElementById(id);
function update(){
  const remaining = OPEN_AT - Date.now();
  if(remaining <= 0){
    $("timerLabel").textContent = "الرسالة متاحة الآن";
    $("timer").classList.add("hidden");
    $("note").classList.add("hidden");
    $("message").textContent = MESSAGE_TEXT;
    $("message").classList.remove("hidden");
    return;
  }
  const total = Math.floor(remaining/1000);
  $("days").textContent = Math.floor(total/86400);
  $("hours").textContent = String(Math.floor(total%86400/3600)).padStart(2,"0");
  $("minutes").textContent = String(Math.floor(total%3600/60)).padStart(2,"0");
  $("seconds").textContent = String(total%60).padStart(2,"0");
}
update(); setInterval(update,1000);
</script>
</body>
</html>
