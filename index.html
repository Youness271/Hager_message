<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة ليك</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#070d19;
  font-family:Tahoma,Arial,sans-serif;
  color:#f3f7ff;
}
.card{
  width:min(100%,440px);
  padding:34px 24px;
  border:1px solid #234b7b;
  border-radius:25px;
  background:#0b1b31;
  text-align:center;
}
.timer{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:25px 0;
}
.unit{
  padding:13px 4px;
  border:1px solid #1e3b60;
  border-radius:13px;
  background:#09182c;
}
.num{
  display:block;
  font-size:27px;
  font-weight:700;
  color:#a6d0ff;
}
.unit small{
  display:block;
  margin-top:5px;
  color:#a8bdd8;
}
.hidden{
  display:none;
}
#message{
  white-space:pre-wrap;
  line-height:1.9;
  text-align:right;
  margin-top:25px;
}
</style>
</head>

<body>

<main class="card">

<h1>رسالة ليك</h1>

<p>رسالة تجريبية</p>

<p id="timerLabel">الوقت المتبقي لفتح الرسالة</p>

<div class="timer" id="timer">

<div class="unit">
<span class="num" id="days">--</span>
<small>يوم</small>
</div>

<div class="unit">
<span class="num" id="hours">--</span>
<small>ساعة</small>
</div>

<div class="unit">
<span class="num" id="minutes">--</span>
<small>دقيقة</small>
</div>

<div class="unit">
<span class="num" id="seconds">--</span>
<small>ثانية</small>
</div>

</div>

<p id="note">الرسالة مش هتفتح غير في الوقت المحدد ليها</p>

<section id="message" class="hidden"></section>

</main>

<script>

const MESSAGE_TEXT = `

أهلًا يا هاجر ❤️

دي مجرد رسالة تجريبية عشان نتأكد إن العداد اشتغل وإن الرسالة بتظهر في الوقت المحدد.

لو إنتِ شايفة الكلام ده، يبقى كل حاجة اشتغلت بنجاح 🎉

شكرًا إنك وصلتي لحد هنا.

`;

const OPEN_AT = Date.now() + 30000;

function update(){

  const remaining = OPEN_AT - Date.now();

  if(remaining <= 0){

    document.getElementById("timerLabel").textContent =
      "الرسالة متاحة الآن";

    document.getElementById("timer").classList.add("hidden");

    document.getElementById("note").classList.add("hidden");

    const message = document.getElementById("message");

    message.textContent = MESSAGE_TEXT;
    message.classList.remove("hidden");

    return;
  }

  const total = Math.floor(remaining / 1000);

  document.getElementById("days").textContent =
    Math.floor(total / 86400);

  document.getElementById("hours").textContent =
    String(Math.floor((total % 86400) / 3600)).padStart(2,"0");

  document.getElementById("minutes").textContent =
    String(Math.floor((total % 3600) / 60)).padStart(2,"0");

  document.getElementById("seconds").textContent =
    String(total % 60).padStart(2,"0");
}

update();
setInterval(update,1000);

</script>

</body>
</html>
