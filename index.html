<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة ليك</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#070d19;
  font-family:Tahoma,Arial,sans-serif;
  color:#f3f7ff;
}
.card{
  width:min(100%,440px);
  padding:34px 24px;
  border:1px solid #234b7b;
  border-radius:25px;
  background:#0b1b31;
  text-align:center;
}
.timer{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin:25px 0;
}
.unit{
  padding:13px 4px;
  border:1px solid #1e3b60;
  border-radius:13px;
  background:#09182c;
}
.num{
  display:block;
  font-size:27px;
  font-weight:700;
  color:#a6d0ff;
}
.unit small{
  display:block;
  margin-top:5px;
  color:#a8bdd8;
}
.hidden{
  display:none;
}
</style>
</head>

<body>

<main class="card">

<h1>رسالة ليك</h1>

<p>رسالة ليكي يا هاجر</p>

<p id="timerLabel">الوقت المتبقي لفتح الرسالة</p>

<div class="timer" id="timer">

<div class="unit">
<span class="num" id="days">--</span>
<small>يوم</small>
</div>

<div class="unit">
<span class="num" id="hours">--</span>
<small>ساعة</small>
</div>

<div class="unit">
<span class="num" id="minutes">--</span>
<small>دقيقة</small>
</div>

<div class="unit">
<span class="num" id="seconds">--</span>
<small>ثانية</small>
</div>

</div>

<p id="note">الرسالة مش هتفتح غير في الوقت المحدد ليها</p>

<section id="message" class="hidden"></section>

</main>

<script>

const MESSAGE_TEXT = `

اه شكلك نسيتي انا مين وشكلك كمان نسيتي كل حاجة ونسيتي حبي واهتمامي وكل حاجة انا كنت مستعد ادفع حياتي وروحي وكل حاجة حواليا عشان تكوني مبسوطة.  
  
بس تعرفي، انا مش كويس خالص يا هاجر....انا بموت يا هاااااجر، بمووووت كل يوم موتة بشعة و جوايا وجع في قلبي ما يتوصفش، وده كله بسببك.....تعرفي ان مستقبلي ضاع ؟  
  
طب تعرفي اني بتعالج نفسياً وجسدياً، وحالتي في مرحلة زززززفت ؟  
  
اه والله، ايه مفكراني بهزر ؟  
  
....طب تعرفي كمان اني سيبت البيت وبقيت عايش لواحدي ؟  
  
لا لا ولا اقولك: تعرفي اني بسببك رجعت لكل عاداتي السيئة الي دمرت حياتي ؟  
  
عصبية بقا ووحدة واي حاجة وسخة انا كنت بعملها رجعتلها وبقت اوحش، وسيبت الچيم وسيبت الدروس وسيبت اهلي بعد مشاكل كبيرة وسيبت اخواتي وسيبت اسامة صاحبي ومحمود وكل الي في حياتي عمتا، بمعني اصح بقيت عايش في وحدة، الي هو اصلا نفس الحاجات الي انا بعدت عنها وقررت اني أسيبها واكون انسان احسن عشانك  
  
طب اقولك علي نكتة علي حلوة ؟ 😂  
  
تعرفي اني انا اصلا مبداتش تالته ثانوي ولا روحت اي دروس ولا عملت ايه حاجة خالص لحد دلوقت وقاعد بتفرج علي مستقبلي وحياتي وهي بتضيع قدامي، لا وايه محمد عبد الغفار فاضل شوية وهينجلط من برودي ومن كتر ما اتكلم معايا، بس مفيش فايدة 😂، ودايما بيقولي انت بتضحك ليه ومستغرب، اصل يا حبة عيني ميعرفش ان انا خلاص اتجننت بسببك، حتي امي مستغربة اني مش طايق اسمك ينذكر قدامي بعد الحب الي حبتهولك ده.  
  
بتضحك صح ؟  
  
تعرفي اني كل يوم قبل ما انام لازم أتوجع واعيط دم عيني بسببك ؟  
  
زياراتي حتي بعرف اعيط واطلع الي جوايا، لإني لازم اموت كل يوم الف مرة بسبب ذكرياتنا واتحسر اني حبيتك الحب ده.....هو انت فين يا هاجر كل ده ؟؟؟  
  
انا لحد انهارده وبرغم الوجع وكل الوقت الي عدي ده، حاسس ان في امل انك هتبعتي و تكلميني تاخدي بخاطري، بس مش بتبعتي يا هااااااجر.....كل يوم لازم ادخل علي شااااااتك عشان اشوفك، يمكن يعني وانا مش واخد بالي مع اني عارف انك مش هتبعتي وعارف ان هيجي اشعار لو بعتي بس برضوووو بدخل زي الاهبل اتاكد.....اه صح الف مبروك علي بروفايل التيك توك....شكلك مبسوطة انك اخير حطيتي صورة بروفايل بصورتك الحلوة الي علي البحر لا وكمان محمد ابن خالك عاملك متابعة وانت كمان عملاله واه في ولاد كمان متبعينك، اظن عادي ؟

حراااااااام عليكي يا شيخة، ليه سيبتيني وروحتي واخدتي كل حاجة حلوة معاكي، اااااايه الأنانية دي بجد ؟؟

وانت كنت بتعامليني ايه ؟  
  
انت كنت بتعامليني بطريقة المفروض مفيش بنت في الدنيا تعامل الي بيحبها وبيخاف عليها كده، انت وريتني اقذر انواع المعاملة في الدنيا دي وانت مش حاسة ومفكر نفسك صحححح  
  
فين الحب في كده بجد ؟؟؟  
  
كل الي طلبته منك انك تكوني جنبي، وانت لما خلاص جبتي اخرك مشيتي وسيبتيني وهانت عليكي عادي كل السنين دب....ايه مستحملتيش مشاكلي 😂، وقلتي خلاص بقا انا اسيبه في وسط كل الي هو فيه ده لواحده وعادي ما انااااااااا مااااااااالي، صصصصااااااااااااااااااااحححححح ؟  
  
هااااااااا، قووووولي ؟؟  
  
انت مفكرة انا ليه لحد دلوقت ما بعتلكيش؟  
  
عشاااااااان اناااااا مش عاوزك توجعي قلبي ااااااااكتر، مش عايز اشوف منك تاني المعاملة الزبالة الي انت بتعامليني بيها، يا ستي اناااااا وحش وانا المشكلة بس مكنش لازم تسيبني في ااااااشد وقت انا كنت محتاجلك فيه ياهاجر  
  
ياشيخة حسبي الله ونعم الوكيل، حسبي الله ونعم الوكيل فيييييييكي، ياريتك تحسي بنص الالم ده حراااااااام عليكي، خلاااااااااااااااااااااص انت نهتيني ولا عارف اتخطاكي ولا عارف اكمل حياتي بسببك وكل حاجة انتهت في حياتي بسببك واهلي بالنسبالي انتهوا بسببك، انت حتي اخدتي الحاجة الوحيدة الي انا كنت مستحمل وبحارب عشناها، انت اخدتي حلمي واخدتي مستقبلي واخدتي الماضي بتاعي واهو حتي الحاضر مش عارف اعيش فيه بسببك.  
  
ااااااااااااااااااااااااااااااااه، انا بككككككككككككررررررررهك، انا حبيتك، ياشيخة حرام عليكي انا حبييييييتك انا انا انا مبقتش شايف غيرك.....ليه تعملي كده ؟  
  
حتي لو انا طريقتي اتغيرت معاكي، ف ده بسبب كل الضغوط الي انت اصلا مش شايفاهة ولا هتشوفيها ولا حتي هتفهميها عشان إنسانة متخلفة وحمااااارة ومش بتفهمي.  
  
انا مش عارف اقولك ايه غير حسبي الله ونعم الوكيل، تعرفي انت لو يوم القيامة مش هتدخلي الجنة بسبب ذنبي ده وهتولعي في النار، ف والله ما مسامحك لو ايه حصللللللللل مش هسامحك يا هاجر يا مراد.  
  
تعرفي انا بكتب الرسالة دي ليه ؟  
  
صدقيني مش عشان ارجعلك ولا عشان تحسي بالي انت وصلتيني ليه لا، بل عشان ساعة ما تقرائيها وتيجي تشوفيني وتدوري عليا ومتلقنيش هتفهمي لواحدك.

انت خسرتي يا هاجر وانا كانت خسارتي اكبر بكتير منك، انت غلطانة وانا كان غلطي اني حبيتك واتعلقت بيكي للدرجة دي.....انت بجد إنسانة حقيرة، بس تعرفي انت خسرتي انسان حبك لدرجة عمرك ما هتتصوريها وحبك اكتر من اي حد موجود في الحياة دي حتي أهله، وكان مستعد أنه يموت في اليوم مليون مرة عشان بس يسعدك ويحققلك كل حاجة انت بتحلمي ونفسك فيها، ويحسسك انك اغلي حاجة عنده، وتكوني دايما حاسة بالأمان معاه حتي لو زعلك، ومش هتعرفي ده غير لما تحبي حد تاني وصدقيني عمره ما هيحبك ربع الحب الي حبتهولك ولا هيقدملك اااااي حاجة، لاني وصلت لمرحلة ان في وسط شدة كرهي ليكي وفي وقت ما قلبي بيتقطع وموجوع منك بقا قلبي ولساني بيخونوني في الصلاة من غير اي ادارك أو وعي مني ويدعو لربنا بإسمك انك تكوني بخير.......ومع ذالك انا هسيبك كده تتعذبي طول عمرك علي الغلطة دي وعمري ما هسامحك حتي لو انت لسه مفكرة ان انا الي ظالمك ف عادي بقا مش فارقة.  
  
  
  
وعمتا يا هاجر الرسالة دي مش هتتفتح غير بعد 5 شهور من دلوقت والي هيوصلك الرسالة دي ممكن يوصلهالك وهيكون شهرين او تلاته عدوا من ال 5 شهور دول، ولو حالفك الحظ وانت بتقرائيها دلوقت في معادها المحدد ف اظن ان انهارده الجمعة والساعة حاليا 3:05pm دلوقت، وده معناه اني انا حاليا في اللحظة دي قريب منك اوي لدرجة انت مش متخيلاهة لدرجة ان ممكن لو طلعتي في الشارع قدام بيتكم دلوقت ممكن تلاقيني معدي عادي ( ده لو فضلت عايش بعد انهارده ) بس اعملي في حسابك لو شوفتيني، ف وقتها انت هتشوفي واحدة تاني عمرك في حياتك ما شوفتيه يا هاجر وهو كذالك مش هيعرفك لانك هتكوني صفحة قديمة وانطوت بالنسباله وهو هيعدي عليكي كأنه مش شايفك بس هيبصلك بنظرة كلها وجع وحسرة، ولأن دي المرة الوحيدة الي هتشوفيني فيها طول عمرك وبعدها......عمرك ما هتشوفيني في حياتك تاني أبداً يا هاجر.  
  
  
لأن بسببك انهارده محمد يونس انتهي.

`;

const OPEN_AT = new Date("2027-03-05T15:00:00+02:00").getTime();

function update(){

  const remaining = OPEN_AT - Date.now();

  if(remaining <= 0){

    document.getElementById("timerLabel").textContent =
      "الرسالة متاحة الآن";

    document.getElementById("timer").classList.add("hidden");

    document.getElementById("note").classList.add("hidden");

    const message = document.getElementById("message");

    message.textContent = MESSAGE_TEXT;
    message.classList.remove("hidden");

    return;
  }

  const total = Math.floor(remaining / 1000);

  document.getElementById("days").textContent =
    Math.floor(total / 86400);

  document.getElementById("hours").textContent =
    String(Math.floor((total % 86400) / 3600)).padStart(2,"0");

  document.getElementById("minutes").textContent =
    String(Math.floor((total % 3600) / 60)).padStart(2,"0");

  document.getElementById("seconds").textContent =
    String(total % 60).padStart(2,"0");
}

update();
setInterval(update,1000);

</script>
